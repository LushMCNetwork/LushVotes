# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Maven
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
#
# bridge/ is a second, independent Maven project living in this same repo (not a reactor
# module of the root pom - see bridge/pom.xml's <relativePath>), so it needs its own build
# step; maven.yml's root-level `mvn package` never touches it.

name: Java CI with Maven (bridge)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      working-directory: bridge
      run: mvn -B package
    - uses: actions/upload-artifact@v4
      with:
        name: "Package (bridge)"
        path: "bridge/target/LushVotesBridge-*.jar"
