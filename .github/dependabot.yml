# Minor/patch grouped into one PR per ecosystem; majors ignored on purpose.
# Security updates are still raised regardless, except for anything under ignore.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Server-provided/-installed: version must track the running server, not the
      # newest release. Dependabot also misreads the SNAPSHOT lines.
      - dependency-name: "dev.folia:*"
      - dependency-name: "io.papermc:*"
      - dependency-name: "com.velocitypowered:*"
      - dependency-name: "net.kyori:*"
      - dependency-name: "com.sk89q.worldedit:*"
      - dependency-name: "com.sk89q.worldguard:*"
      - dependency-name: "me.clip:*"
      # Vendored into libs/, published to no registry - see libs/README.md.
      - dependency-name: "com.playgamesinteractive:*"
      # Compile-only stub, pinned - see libs/README.md.
      - dependency-name: "com.vexsoftware:*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: "/bridge"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Server-provided/-installed: version must track the running server, not the
      # newest release. Dependabot also misreads the SNAPSHOT lines.
      - dependency-name: "dev.folia:*"
      - dependency-name: "io.papermc:*"
      - dependency-name: "com.velocitypowered:*"
      - dependency-name: "net.kyori:*"
      - dependency-name: "com.sk89q.worldedit:*"
      - dependency-name: "com.sk89q.worldguard:*"
      - dependency-name: "me.clip:*"
      # Vendored into libs/, published to no registry - see libs/README.md.
      - dependency-name: "com.playgamesinteractive:*"
      # Compile-only stub, pinned - see libs/README.md.
      - dependency-name: "com.vexsoftware:*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    groups:
      github-actions:
        patterns: ["*"]
